<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b0d">
<title>Kannada Auto Voice</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#f4f4f5;background:#0b0b0d}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#1a1a20,#0b0b0d 48%);padding:18px}
main{max-width:720px;margin:auto}.card{background:#141419;border:1px solid #292930;border-radius:22px;padding:18px;margin:12px 0;box-shadow:0 12px 40px #0006}
h1{font-size:24px;margin:0 0 5px}.muted{color:#9b9ba5;font-size:13px}
textarea{width:100%;min-height:260px;background:#0d0d10;color:#fff;border:1px solid #303039;border-radius:14px;padding:14px;font-size:16px;line-height:1.6;resize:vertical}
select,button{width:100%;border:0;border-radius:13px;padding:14px;font-size:15px}
select{background:#24242b;color:#fff;border:1px solid #363640}button{background:#fff;color:#09090b;font-weight:700;cursor:pointer}button.secondary{background:#24242b;color:#fff;border:1px solid #363640}button:disabled{opacity:.45}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stats{display:flex;gap:12px;flex-wrap:wrap;color:#c9c9d1;font-size:13px}
.bar{height:10px;background:#292930;border-radius:99px;overflow:hidden}.fill{height:100%;width:0;background:#fff;transition:width .25s}
#status{white-space:pre-wrap;color:#c9c9d1;font-size:13px}.chunks{max-height:280px;overflow:auto}.chunk{display:flex;gap:9px;align-items:center;padding:9px 0;border-bottom:1px solid #24242a;font-size:13px}.ok{color:#a7f3d0}.wait{color:#a1a1aa}.bad{color:#fca5a5}
a.download{display:block;color:#fff;text-decoration:none;background:#24242b;padding:10px 12px;border-radius:10px;margin-top:7px}
.small{font-size:12px;color:#8f8f99}.danger{color:#fca5a5}
</style>
</head>
<body>
<main>
<div class="card">
<h1>🎙️ Kannada Auto Voice</h1>
<div class="muted">Paste Kannada narration → choose voice → generate MP3 automatically.</div>
</div>

<div class="card">
<textarea id="script" placeholder="Paste your Kannada script here..."></textarea>
<div class="stats" style="margin-top:10px"><span id="chars">0 characters</span><span id="chunks">0 chunks</span></div>
</div>

<div class="card">
<label class="muted">Voice</label>
<select id="voice"><option>Loading voices...</option></select>
<div style="height:10px"></div>
<label class="muted">Model</label>
<select id="model">
<option value="eleven_multilingual_v2">Eleven Multilingual v2</option>
<option value="eleven_v3">Eleven v3</option>
</select>
<div style="height:10px"></div>
<div class="row">
<button id="generate">GENERATE AUDIO</button>
<button id="stop" class="secondary" disabled>STOP</button>
</div>
</div>

<div class="card">
<div class="stats"><b id="progressText">0 / 0</b><span id="percent">0%</span></div>
<div class="bar" style="margin:10px 0 12px"><div class="fill" id="fill"></div></div>
<div id="status">Ready.</div>
<div class="chunks" id="list"></div>
</div>

<div class="card" id="downloads" style="display:none">
<h3 style="margin-top:0">Downloads</h3>
<button id="merge" class="secondary">MERGE ALL MP3s</button>
<div id="links"></div>
</div>

<div class="card small">
API key stays on the server. Never put your ElevenLabs key in this page.
</div>
</main>

<script>
const $=id=>document.getElementById(id);
let stopped=false, generated=[], chunks=[];

function splitKannada(text, max=2800){
  text=text.replace(/\r/g,'').trim();
  if(!text)return [];
  const paras=text.split(/\n\s*\n/).map(x=>x.trim()).filter(Boolean);
  const out=[];
  for(const p of paras){
    if(p.length<=max){out.push(p);continue}
    const sentences=p.match(/[^.!?।…]+[.!?।…]+|[^.!?।…]+$/gu)||[p];
    let cur='';
    for(const s0 of sentences){
      const s=s0.trim();
      if(cur && (cur.length+s.length+1)>max){out.push(cur);cur=''}
      if(s.length<=max) cur+=(cur?' ':'')+s;
      else{
        for(let i=0;i<s.length;i+=max) {
          const part=s.slice(i,i+max).trim();
          if(part) out.push(part);
        }
      }
    }
    if(cur)out.push(cur);
  }
  return out;
}
function refresh(){
  const t=$('script').value;
  chunks=splitKannada(t);
  $('chars').textContent=t.length.toLocaleString()+' characters';
  $('chunks').textContent=chunks.length+' chunks';
}
$('script').addEventListener('input',refresh);

async function loadVoices(){
  try{
    const r=await fetch('/api/voices');
    const d=await r.json();
    if(!r.ok)throw Error(d.error||'Could not load voices');
    $('voice').innerHTML='';
    d.voices.forEach(v=>{
      const o=document.createElement('option');o.value=v.voice_id;o.textContent=v.name; $('voice').appendChild(o);
    });
  }catch(e){
    $('voice').innerHTML='<option value="">Voice loading failed</option>';
    $('status').textContent='Voice list error: '+e.message;
  }
}
function setProgress(done,total){
  const pct=total?Math.round(done/total*100):0;
  $('progressText').textContent=`${done} / ${total}`;
  $('percent').textContent=pct+'%';
  $('fill').style.width=pct+'%';
}
function renderList(){
  $('list').innerHTML=chunks.map((_,i)=>`<div class="chunk" id="c${i}"><span class="wait">⏳</span><span>Chunk ${i+1}</span></div>`).join('');
}
function mark(i,state,msg=''){
  const el=$('c'+i); if(!el)return;
  el.querySelector('span').textContent=state==='ok'?'✅':state==='bad'?'❌':'⏳';
  el.querySelector('span').className=state;
  if(msg)el.title=msg;
}
async function generate(){
  refresh();
  if(!chunks.length){$('status').textContent='Paste a script first.';return}
  if(!$('voice').value){$('status').textContent='No voice available.';return}
  stopped=false;generated=[];$('links').innerHTML='';$('downloads').style.display='none';
  $('generate').disabled=true;$('stop').disabled=false;renderList();setProgress(0,chunks.length);
  const voice=$('voice').value,model=$('model').value;
  for(let i=0;i<chunks.length;i++){
    if(stopped)break;
    mark(i,'wait');$('status').textContent=`Generating chunk ${i+1} of ${chunks.length}…`;
    try{
      const r=await fetch('/api/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
        text:chunks[i],voice_id:voice,model_id:model,
        previous_text:i?chunks[i-1]:'',next_text:i+1<chunks.length?chunks[i+1]:''
      })});
      if(!r.ok){
        const d=await r.json().catch(()=>({}));
        throw Error(d.error||`HTTP ${r.status}`);
      }
      const blob=await r.blob();
      generated.push({index:i,blob,name:`kannada_${String(i+1).padStart(3,'0')}.mp3`});
      mark(i,'ok');setProgress(i+1,chunks.length);
    }catch(e){
      mark(i,'bad',e.message);$('status').textContent=`Stopped at chunk ${i+1}: ${e.message}`;break;
    }
  }
  if(generated.length){
    $('downloads').style.display='block';
    $('links').innerHTML=generated.map(x=>`<a class="download" download="${x.name}" href="${URL.createObjectURL(x.blob)}">⬇️ ${x.name}</a>`).join('');
  }
  if(!stopped && generated.length===chunks.length)$('status').textContent='✅ Complete.';
  else if(stopped)$('status').textContent='Stopped. Completed chunks are ready below.';
  $('generate').disabled=false;$('stop').disabled=true;
}
$('generate').onclick=generate;
$('stop').onclick=()=>{stopped=true;$('status').textContent='Stopping after the current chunk…'};
$('merge').onclick=()=>{
  if(generated.length!==chunks.length){$('status').textContent='Generate all chunks before merging.';return}
  // MP3 frames can be concatenated. Most players accept the result.
  const blob=new Blob(generated.sort((a,b)=>a.index-b.index).map(x=>x.blob),{type:'audio/mpeg'});
  const a=document.createElement('a');a.download='kannada_narration.mp3';a.href=URL.createObjectURL(blob);a.click();
};
loadVoices();refresh();
</script>
</body>
</html>
